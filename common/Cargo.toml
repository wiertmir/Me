[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
opentelemetry = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = "0.33.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["sync", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json"] }
utoipa = "6.0.0"
uuid = { version = "1.27.0", features = ["serde", "v4"] }

[dev-dependencies]
base64 = "0.23.1"
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.10.3"
tokio = { version = "1.53.1", features = ["full", "macros", "rt", "rt-multi-thread"] }
