[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "time"] }
tracing = "0.1.44"
utoipa = "6.0.0"
uuid = { version = "1.27.0", features = ["serde"] }

[dev-dependencies]
base64 = "0.23.1"
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.10.3"
tokio = { version = "1.53.1", features = ["full", "macros", "rt", "rt-multi-thread"] }
