# Development config. Copy to config.local.toml for real use; every value can be
# overridden with ME_CALDAV__<FIELD> (e.g. ME_CALDAV__AUTH_SECRET, ME_CALDAV__LOG__LEVEL).
listen = "127.0.0.1:8085"
# The three services this bridge speaks to, and the service secret of each.
auth_url = "http://127.0.0.1:8081"
calendar_url = "http://127.0.0.1:8083"
tasks_url = "http://127.0.0.1:8084"
# DEV ONLY: change these (via ME_CALDAV__AUTH_SECRET etc.) for any real deployment. The bridge refuses to
# start with this exact value when `listen` is not a loopback address, and warns about it otherwise.
auth_secret = "dev-only-service-secret-change-me"
calendar_secret = "dev-only-service-secret-change-me"
tasks_secret = "dev-only-service-secret-change-me"

[log]
format = "pretty"        # "pretty" | "json"
level = "debug"
# Also write the log to <dir>/<service>-YYYYMMDD.log, a new file each day; the newest 31 are kept.
# dir = "./logs"
